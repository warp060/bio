<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Mohammed Abbas R.Y.</title>

    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">

    <style>
        body {
            background-color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.15);
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand-icon {
            width: 56px;
            height: 56px;
            background: var(--accent-gold-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #ffffff;
            margin: 0 auto 1rem auto;
            box-shadow: 0 8px 20px var(--accent-gold-glow);
        }

        .login-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .error-alert {
            background: rgba(225, 29, 72, 0.1);
            border: 1px solid rgba(225, 29, 72, 0.3);
            color: var(--accent-rose);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .password-toggle-group {
            position: relative;
        }

        .password-toggle-group i {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            cursor: pointer;
        }

        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--accent-gold-dark);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Admin Portal</h2>
            <p>Enter your credentials to access the portfolio dashboard</p>
        </div>

        <div id="error-alert" class="error-alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="error-text">Invalid Email or Password</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label><i class="fa-solid fa-envelope" style="color: var(--accent-gold-primary); margin-right: 4px;"></i> Gmail / Email</label>
                <input type="email" id="email-input" class="form-control" placeholder="abbas@gmail.com" value="abbas@gmail.com" required>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-lock" style="color: var(--accent-gold-primary); margin-right: 4px;"></i> Password</label>
                <div class="password-toggle-group">
                    <input type="password" id="password-input" class="form-control" placeholder="••••••••" value="admin123" required>
                    <i class="fa-solid fa-eye" id="toggle-pwd-btn"></i>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.85rem;">
                <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-muted);">
                    <input type="checkbox" id="remember-me" checked style="accent-color: var(--accent-gold-primary)"> Remember Me
                </label>
                <span style="color: var(--accent-gold-dark); font-weight: 600; cursor: pointer;" onclick="alert('Default password is: admin123')">Forgot Password?</span>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Admin Panel
            </button>
        </form>

        <div class="login-footer">
            <a href="index.html">← Back to Public Portfolio</a>
        </div>
    </div>

    <script>
        // Password Visibility Toggle
        const pwdInput = document.getElementById('password-input');
        const toggleBtn = document.getElementById('toggle-pwd-btn');

        toggleBtn.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                toggleBtn.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Login Handler
        const loginForm = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');
        const errorText = document.getElementById('error-text');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value.trim().toLowerCase();
            const password = document.getElementById('password-input').value;
            const rememberMe = document.getElementById('remember-me').checked;

            // Secure Admin Credentials Check
            // Configurable: abbas@gmail.com / admin123
            if (email === 'abbas@gmail.com' && password === 'admin123') {
                errorAlert.style.display = 'none';

                if (rememberMe) {
                    localStorage.setItem('admin_authenticated', 'true');
                    localStorage.setItem('admin_user_email', email);
                } else {
                    sessionStorage.setItem('admin_authenticated', 'true');
                    sessionStorage.setItem('admin_user_email', email);
                }

                window.location.href = 'admin.html';
            } else {
                errorText.textContent = 'Invalid Gmail or Password!';
                errorAlert.style.display = 'flex';
            }
        });
    </script>

</body>
</html>
